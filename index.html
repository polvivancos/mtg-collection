<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MTG Collection</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MTG Collection">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='36' fill='%230c0d10'/%3E%3Ccircle cx='90' cy='90' r='60' fill='none' stroke='%23c9a96e' stroke-width='7'/%3E%3Cpath d='M90 38v104M38 90h104' stroke='%23c9a96e' stroke-width='7'/%3E%3C/svg%3E">
<style>
:root{color-scheme:light dark;--bg:#0c0d10;--surface:#15171c;--surface2:#1d2027;--text:#f4f5f7;--muted:#9da3ae;--line:#2b2f38;--accent:#c9a96e;--danger:#e58b8b}
@media(prefers-color-scheme:light){:root{--bg:#f5f5f2;--surface:#fff;--surface2:#f0f1ee;--text:#17191d;--muted:#69707a;--line:#dedfdc;--accent:#876a36}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh;background:var(--bg)}
header{padding:22px 24px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);z-index:5}.brand{display:flex;align-items:center;justify-content:space-between;gap:16px}.title{font-size:25px;font-weight:800;letter-spacing:-.5px}.sub{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px}button,select,input{font:inherit}button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:9px 12px;cursor:pointer}button.primary{background:var(--accent);color:#111;border-color:var(--accent);font-weight:700}
main{max-width:1280px;margin:auto;padding:22px 24px 40px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}.stat b{display:block;font-size:25px}.stat span{color:var(--muted);font-size:12px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.search{flex:1;min-width:230px;padding:11px 13px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters select{padding:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px}
.chips{display:flex;gap:7px;overflow:auto;padding-bottom:4px;margin-bottom:18px}.chip{white-space:nowrap;padding:7px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}.chip.active{color:var(--text);border-color:var(--accent)}
.collection{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}.row{display:grid;grid-template-columns:58px minmax(220px,2fr) 1.3fr 90px 110px 100px;gap:12px;align-items:center;padding:12px 15px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.head{color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--surface2)}.thumb{width:44px;height:61px;border-radius:5px;background:linear-gradient(145deg,#30333a,#111318);display:flex;align-items:center;justify-content:center;color:#aaa;font-size:10px;text-align:center}.cardname{font-weight:700}.meta{color:var(--muted);font-size:12px}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 7px;font-size:11px}.qty{font-weight:800;font-size:17px}.empty{padding:45px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.dialog{width:min(680px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}.dialog h2{margin:0 0 16px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{display:grid;gap:6px;color:var(--muted);font-size:12px}.form input,.form select{padding:10px;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:9px}.wide{grid-column:1/-1}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
@media(max-width:800px){header{padding:16px}.brand{align-items:flex-start}.title{font-size:21px}main{padding:16px}.stats{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:48px 1fr 70px;padding:11px}.row .set,.row .mana,.row .rarity{display:none}.head{display:none}.thumb{width:38px;height:53px}.form{grid-template-columns:1fr}.wide{grid-column:auto}}

.scanner-dialog{width:min(760px,100%)}.scanner-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.camera-wrap{position:relative;margin:16px 0;border-radius:14px;overflow:hidden;background:#050607;aspect-ratio:3/4;max-height:62vh}.camera-wrap video{width:100%;height:100%;object-fit:cover}.scan-frame{position:absolute;inset:18% 12%;border:2px solid var(--accent);border-radius:10px;box-shadow:0 0 0 999px #0005}.scanner-actions{display:flex;gap:8px;flex-wrap:wrap}.scan-status{margin-top:12px;color:var(--muted);min-height:22px}.scan-result{display:grid;grid-template-columns:80px 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;margin-top:10px;background:var(--surface2)}.scan-result img{width:70px;border-radius:7px}.scan-result .title{font-size:16px}.scan-result .meta{margin-top:3px}@media(max-width:600px){.scanner-dialog{padding:14px}.camera-wrap{aspect-ratio:4/5}.scan-result{grid-template-columns:62px 1fr}.scan-result img{width:58px}.scan-result button{grid-column:1/-1}}
</style>
</head>
<body><div class="app">
<header><div class="brand"><div><div class="title">MTG Collection</div><div class="sub">El teu inventari de Magic: The Gathering</div></div><div class="actions"><button id="scanBtn">📷 Escanejar</button><button id="exportBtn">Exporta</button><button class="primary" id="addBtn">+ Afegir carta</button></div></div></header>
<main>
<section class="stats"><div class="stat"><b id="totalQty">0</b><span>Cartes totals</span></div><div class="stat"><b id="uniqueQty">0</b><span>Cartes diferents</span></div><div class="stat"><b id="setQty">0</b><span>Col·leccions</span></div><div class="stat"><b id="foilQty">0</b><span>Foils</span></div></section>
<div class="toolbar"><input class="search" id="search" placeholder="Cerca per nom, col·lecció o número..."><div class="filters"><select id="color"><option value="">Tots els colors</option><option>Blanc</option><option>Blau</option><option>Negre</option><option>Vermell</option><option>Verd</option><option>Multicolor</option><option>Incolor</option><option>Terreny</option></select><select id="set"><option value="">Totes les col·leccions</option></select><select id="sort"><option value="name">Nom A → Z</option><option value="nameDesc">Nom Z → A</option><option value="mana">Manà</option><option value="set">Col·lecció</option><option value="qty">Quantitat</option></select></div></div>
<div class="chips"><button class="chip active" data-view="all">Tota la col·lecció</button><button class="chip" data-view="recent">Afegides recentment</button><button class="chip" data-view="foil">Foil</button><button class="chip" data-view="duplicates">Duplicades</button></div>
<section class="collection"><div class="row head"><div></div><div>Carta</div><div class="set">Col·lecció</div><div class="mana">Manà</div><div class="rarity">Raresa</div><div>Quantitat</div></div><div id="list"></div></section>
</main></div>
<div class="modal" id="scannerModal"><div class="dialog scanner-dialog"><div class="scanner-head"><div><h2>Escanejar carta</h2><div class="sub">Apunta la càmera a la carta. L’OCR llegirà el nom i consultarà Scryfall.</div></div><button id="closeScanner">Tanca</button></div><div class="camera-wrap"><video id="camera" autoplay playsinline muted></video><canvas id="capture" hidden></canvas><div class="scan-frame"></div></div><div class="scanner-actions"><button class="primary" id="captureBtn">📸 Captura i identifica</button><button id="uploadBtn">🖼️ Foto de la galeria</button><input id="photoInput" type="file" accept="image/*" capture="environment" hidden></div><div id="scanStatus" class="scan-status"></div><div id="scanResults"></div></div></div><div class="modal" id="modal"><div class="dialog"><h2>Afegir carta</h2><div class="form"><label>Nom<input id="fName" placeholder="Lightning Bolt"></label><label>Col·lecció<input id="fSet" placeholder="M10"></label><label>Número<input id="fNum" placeholder="150"></label><label>Color<select id="fColor"><option>Vermell</option><option>Blau</option><option>Blanc</option><option>Negre</option><option>Verd</option><option>Multicolor</option><option>Incolor</option><option>Terreny</option></select></label><label>Cost de manà<input id="fMana" placeholder="R"></label><label>Raresa<select id="fRarity"><option>Common</option><option>Uncommon</option><option>Rare</option><option>Mythic</option></select></label><label>Quantitat<input id="fQty" type="number" min="1" value="1"></label><label>Foil<select id="fFoil"><option value="false">No</option><option value="true">Sí</option></select></label></div><div class="dialog-actions"><button id="cancel">Cancel·la</button><button class="primary" id="save">Afegir</button></div></div></div>
<script>
const seed=[
{name:'Lightning Bolt',set:'Magic 2010',num:'149',color:'Vermell',mana:'R',rarity:'Common',qty:4,foil:false,added:'2026-10-01'},
{name:'Sol Ring',set:'Commander Masters',num:'394',color:'Incolor',mana:'1',rarity:'Uncommon',qty:2,foil:true,added:'2026-09-30'},
{name:'Counterspell',set:'The Brothers’ War Retro Artifacts',num:'81',color:'Blau',mana:'UU',rarity:'Uncommon',qty:3,foil:false,added:'2026-09-29'},
{name:'Swords to Plowshares',set:'Commander Legends',num:'39',color:'Blanc',mana:'W',rarity:'Uncommon',qty:4,foil:false,added:'2026-09-28'},
{name:'Birds of Paradise',set:'Ravnica Remastered',num:'157',color:'Verd',mana:'G',rarity:'Rare',qty:1,foil:false,added:'2026-09-27'},
{name:'Thoughtseize',set:'Theros',num:'107',color:'Negre',mana:'B',rarity:'Rare',qty:2,foil:true,added:'2026-09-26'},
{name:'Breeding Pool',set:'Ravnica Remastered',num:'287',color:'Terreny',mana:'',rarity:'Rare',qty:2,foil:false,added:'2026-09-25'},
{name:'Atraxa, Praetors’ Voice',set:'Commander Masters',num:'193',color:'Multicolor',mana:'GWUB',rarity:'Mythic',qty:1,foil:false,added:'2026-09-24'}];
let cards=JSON.parse(localStorage.getItem('mtgCards')||'null')||seed;let view='all';
const $=id=>document.getElementById(id);
function saveStore(){localStorage.setItem('mtgCards',JSON.stringify(cards))}
function stats(){ $('totalQty').textContent=cards.reduce((a,c)=>a+c.qty,0);$('uniqueQty').textContent=cards.length;$('setQty').textContent=new Set(cards.map(c=>c.set)).size;$('foilQty').textContent=cards.filter(c=>c.foil).reduce((a,c)=>a+c.qty,0);const sets=[...new Set(cards.map(c=>c.set))].sort();$('set').innerHTML='<option value="">Totes les col·leccions</option>'+sets.map(s=>`<option>${s}</option>`).join('')}
function render(){stats();let q=$('search').value.toLowerCase(),color=$('color').value,set=$('set').value,sort=$('sort').value;let arr=cards.filter(c=>(!q||[c.name,c.set,c.num].join(' ').toLowerCase().includes(q))&&(!color||c.color===color)&&(!set||c.set===set));if(view==='recent')arr=arr.filter(c=>c.added>='2026-09-28');if(view==='foil')arr=arr.filter(c=>c.foil);if(view==='duplicates')arr=arr.filter(c=>c.qty>1);arr.sort((a,b)=>sort==='name'?a.name.localeCompare(b.name):sort==='nameDesc'?b.name.localeCompare(a.name):sort==='mana'?a.mana.length-b.mana.length:sort==='set'?a.set.localeCompare(b.set):b.qty-a.qty);$('list').innerHTML=arr.length?arr.map((c,i)=>`<div class="row"><div class="thumb">${c.name.slice(0,2).toUpperCase()}</div><div><div class="cardname">${c.name}</div><div class="meta">${c.color} · #${c.num}${c.foil?' · ✨ Foil':''}</div></div><div class="set"><div>${c.set}</div><div class="meta">${c.num}</div></div><div class="mana">${c.mana||'—'}</div><div class="rarity"><span class="badge">${c.rarity}</span></div><div class="qty">×${c.qty}</div></div>`).join(''):'<div class="empty">No hi ha cartes que coincideixin amb els filtres.</div>'}
['search','color','set','sort'].forEach(id=>$(id).addEventListener('input',render));document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;render()});
$('addBtn').onclick=()=>{$('modal').classList.add('open');$('fName').focus()};$('cancel').onclick=()=>$('modal').classList.remove('open');$('save').onclick=()=>{let name=$('fName').value.trim();if(!name)return;let item={name,set:$('fSet').value.trim()||'Desconeguda',num:$('fNum').value.trim()||'—',color:$('fColor').value,mana:$('fMana').value.trim(),rarity:$('fRarity').value,qty:Math.max(1,+$('fQty').value||1),foil:$('fFoil').value==='true',added:new Date().toISOString().slice(0,10)};let existing=cards.find(c=>c.name.toLowerCase()===item.name.toLowerCase()&&c.set.toLowerCase()===item.set.toLowerCase()&&c.foil===item.foil);if(existing)existing.qty+=item.qty;else cards.push(item);saveStore();$('modal').classList.remove('open');document.querySelectorAll('.form input').forEach(x=>x.value='');$('fQty').value=1;render()};
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(cards,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mtg-collection.json';a.click();URL.revokeObjectURL(a.href)};

// Scanner v0.2: camera + OCR (Tesseract.js) + Scryfall lookup.
let stream=null;
const scanner=$('scannerModal'), camera=$('camera'), capture=$('capture'), scanStatus=$('scanStatus'), scanResults=$('scanResults');
function openScanner(){scanner.classList.add('open');scanStatus.textContent='Iniciant la càmera…';scanResults.innerHTML=''; startCamera();}
async function startCamera(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:1920}},audio:false});camera.srcObject=stream;scanStatus.textContent='Càmera activa. Centra el nom de la carta dins del marc.';}catch(e){scanStatus.textContent='No s’ha pogut obrir la càmera. Pots seleccionar una foto de la galeria.';}}
function closeScanner(){scanner.classList.remove('open');if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}camera.srcObject=null;}
async function loadOCR(){if(window.Tesseract)return window.Tesseract;scanStatus.textContent='Carregant el motor de lectura…';await new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';sc.onload=resolve;sc.onerror=reject;document.head.appendChild(sc)});return window.Tesseract;}
async function identifyImage(blob){try{scanStatus.textContent='Llegint el text de la carta…';const T=await loadOCR();const result=await T.recognize(blob,'eng',{logger:m=>{if(m.status==='recognizing text')scanStatus.textContent=`Llegint la carta… ${Math.round((m.progress||0)*100)}%`;}});const raw=(result.data.text||'').replace(/\n+/g,'\n').trim();const lines=raw.split('\n').map(x=>x.trim()).filter(Boolean);const candidates=lines.slice(0,5);scanStatus.textContent='Buscant la carta a Scryfall…';let found=null;for(const line of candidates){if(line.length<3)continue;const url='https://api.scryfall.com/cards/named?fuzzy='+encodeURIComponent(line);try{const r=await fetch(url,{headers:{Accept:'application/json'}});if(r.ok){found=await r.json();break;}}catch(e){}}if(!found){scanStatus.textContent='No he pogut identificar-la automàticament. Pots introduir-ne el nom.';showManualFromOCR(candidates[0]||'');return;}renderScanResult(found,raw);}catch(e){scanStatus.textContent='No s’ha pogut processar la foto. Prova amb més llum i que el nom sigui ben visible.';}}
function renderScanResult(card,ocr){const img=card.image_uris?.small||card.card_faces?.[0]?.image_uris?.small||'';const setName=card.set_name||card.set||'';const colors=card.colors||[];const colorMap={W:'Blanc',U:'Blau',B:'Negre',R:'Vermell',G:'Verd'};let color=colors.length===1?colorMap[colors[0]]:(colors.length>1?'Multicolor':(card.type_line?.includes('Land')?'Terreny':'Incolor'));scanResults.innerHTML=`<div class="scan-result">${img?`<img src="${img}" alt="${card.name}">`:'<div class="thumb">MTG</div>'}<div><div class="title">${card.name}</div><div class="meta">${setName} · #${card.collector_number||'—'} · ${card.rarity||''}</div><div class="meta">${card.mana_cost||'—'} · ${color}</div></div><button class="primary" id="addScanned">+ Afegir</button></div>`;$('addScanned').onclick=()=>{addCardFromScryfall(card,color);};scanStatus.textContent='Carta identificada. Revisa-la i afegeix-la a la col·lecció.';}
function addCardFromScryfall(card,color){const foil=false;const item={name:card.name,set:card.set_name||card.set||'Desconeguda',num:card.collector_number||'—',color,mana:card.mana_cost||'',rarity:(card.rarity||'').replace(/^./,x=>x.toUpperCase()),qty:1,foil,added:new Date().toISOString().slice(0,10),scryfallId:card.id,image:card.image_uris?.small||card.card_faces?.[0]?.image_uris?.small||''};const existing=cards.find(c=>c.scryfallId===item.scryfallId&&c.foil===foil);if(existing)existing.qty+=1;else cards.push(item);saveStore();render();scanStatus.textContent=`Afegida: ${card.name}`;}
function showManualFromOCR(name){scanResults.innerHTML=`<div class="form" style="margin-top:12px"><label>Nom detectat<input id="ocrName" value="${(name||'').replace(/"/g,'&quot;')}"></label><button class="primary" id="ocrSearch" style="align-self:end">Cercar a Scryfall</button></div>`;$('ocrSearch').onclick=async()=>{const q=$('ocrName').value.trim();if(!q)return;scanStatus.textContent='Cercant…';try{const r=await fetch('https://api.scryfall.com/cards/named?fuzzy='+encodeURIComponent(q),{headers:{Accept:'application/json'}});if(!r.ok)throw new Error();const card=await r.json();const colors=card.colors||[];const map={W:'Blanc',U:'Blau',B:'Negre',R:'Vermell',G:'Verd'};const color=colors.length===1?map[colors[0]]:(colors.length>1?'Multicolor':(card.type_line?.includes('Land')?'Terreny':'Incolor'));renderScanResult(card,q);}catch(e){scanStatus.textContent='No he trobat cap carta amb aquest nom.';}}}
$('scanBtn').onclick=openScanner;$('closeScanner').onclick=closeScanner;$('captureBtn').onclick=async()=>{if(!camera.videoWidth){scanStatus.textContent='La càmera encara no està preparada.';return;}capture.width=camera.videoWidth;capture.height=camera.videoHeight;capture.getContext('2d').drawImage(camera,0,0);capture.toBlob(blob=>identifyImage(blob),'image/jpeg',0.9)};$('uploadBtn').onclick=()=>$('photoInput').click();$('photoInput').onchange=e=>{const f=e.target.files?.[0];if(f)identifyImage(f)};
render();
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {})); }
</script></body></html>
